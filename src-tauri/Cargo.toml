[package]
name = "yijing"
version = "0.1.0"
description = "弈境围棋棋谱管理与 AI 复盘"
authors = ["Yijing"]
edition = "2021"

[lib]
name = "yijing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"

